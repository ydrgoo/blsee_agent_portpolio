<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>모의 편집기</title>
    <style>
      body { margin: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f4; }
      .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #222; color: #eee; font-size: 13px; }
      .bar select, .bar button { font: inherit; }
      .se-content { width: 760px; margin: 16px auto; padding: 20px; background: #fff; min-height: 80vh; outline: none; }
      .se-component { position: relative; margin: 6px 0; padding: 2px 4px; border: 1px solid transparent; cursor: text; }
      .se-component.selected { border-color: #4a7cff; background: #f2f6ff; }
      .se-component .tag { position: absolute; left: -64px; top: 2px; width: 60px; text-align: right; font-size: 10px; color: #999; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span>모의 편집기</span>
      <select id="doc"></select>
      <button id="load">불러오기</button>
      <span id="status"></span>
    </div>
    <div class="se-content" id="content" tabindex="0"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
