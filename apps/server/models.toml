# 노드별 모델 설정. 서버를 켤 때 읽고, 모델이 src/pricing.ts 가격표에 없으면 서버가 뜨지 않는다.
#
# [chat]: 사용자와 대화하고 편집 결과를 검토한다. 편집이 필요하면 [plan]에 넘긴다.
# [chat], [plan], [action], [write], [image-instruction], [image-judge], [infographic-draw], [infographic-judge]: LangChain 채팅 모델
# [action]: 글을 패치로 고친다(edit). [write]: 새 글을 지어 쓴다(write, 대화 전체와 문서 앞뒤를 본다).
#   provider = "google-genai" (ChatGoogleGenerativeAI) | "perplexity" (ChatPerplexity)
#   [*.params]는 그 클래스의 생성자 필드 그대로 (예: temperature, maxOutputTokens)
# [image-instruction]: 이미지 지시(명세)를 쓴다. [image-draw]: 픽셀을 그린다. [image-judge]: 만든 이미지를 보고 판정한다.
# [infographic-draw]: 인포그래픽 HTML을 쓰고 고친다. [infographic-judge]: 렌더한 인포그래픽을 보고 판정한다.
# [review]: 문서를 조각으로 나눠 점검한다 (조각·사진·전체 점검, 사실 판정).
# [prompt-make]: 지금까지의 작업을 다시 부를 프롬프트로 쓴다 (/make-prompt). [prompt-normalize]: 매번 바꿀 값을 {{칸}}으로 바꿔 일반화한다. [prompt-extract]: 이름·설명·칸 설명을 뽑는다.
# [view], [image-draw]: Gemini SDK generateContent. [*.params]는 GenerateContentConfig 필드 그대로
# [search]: Perplexity Agent API(POST /v1/agent)를 공식 SDK로 한 번 부른다. [search.params]는 요청 필드 그대로
#   (예: max_output_tokens). 검색 요금은 search_type별로 다르다.

[chat]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[plan]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[action]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[write]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

# 이미지 생성·수정 지시(명세)를 쓴다. 픽셀을 그리는 [image-draw]와 다르다.
[image-instruction]
provider = "google-genai"
model = "gemini-3.5-flash"

[image-draw]
model = "gemini-nano-banana-2.1"

[image-judge]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[infographic-draw]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[infographic-judge]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[review]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[prompt-make]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[prompt-normalize]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[prompt-extract]
provider = "google-genai"
model = "gemini-3.1-flash-lite"

[view]
model = "gemini-3.1-flash-lite"

[search]
model = "perplexity/sonar"
# "fast" (Fast Search, 1회 $0.001) | "web" (일반, 1회 $0.0025)
search_type = "fast"
country = "KR"

[search.params]
max_output_tokens = 2000

[loop]
# 계획 → 실행 회차 상한 (대화가 검토 후 다시 넘기는 것 포함). 없으면 제한하지 않는다.
# max_rounds = 5
# 계획을 못 세우거나 실행이 실패하는 일이 이만큼 이어지면 멈춘다.
max_consecutive_errors = 2
